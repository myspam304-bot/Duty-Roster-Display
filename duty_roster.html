<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-1 Duty Board</title>

<style>
  @font-face {
    font-family: "system-serif";
    src: local("Georgia"), local("Cambria"), local("Times New Roman");
  }

  :root{
    --black:#0b0b0a;
    --panel:#141412;
    --plate:#1c1b18;
    --gray:#8b8d8e;
    --gray-dim:#54555a;
    --gold:#c5a032;
    --gold-bright:#e9c85a;
    --off-white:#efece2;
    --rule: rgba(197,160,50,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(circle at 50% -10%, #1d1c18 0%, #0b0b0a 55%);
    color: var(--off-white);
    font-family: "Trebuchet MS", "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .board{
    width:100%;
    max-width: 640px;
    border: 1px solid var(--rule);
    background: var(--panel);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      0 20px 60px rgba(0,0,0,0.55);
    position: relative;
  }

  .board::before{
    content:"";
    position:absolute;
    inset: 10px;
    border: 1px solid rgba(139,141,142,0.25);
    pointer-events:none;
  }

  .board-top{
    padding: 34px 40px 20px;
    text-align:center;
  }

  .crest{
    display:inline-block;
    width: 46px;
    height: 46px;
    margin-bottom: 14px;
    position: relative;
  }
  .crest svg{ width:100%; height:100%; display:block; }

  .unit{
    font-family: Georgia, "system-serif", "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--gray);
    margin: 0 0 6px;
  }

  h1{
    font-family: Georgia, "system-serif", "Times New Roman", serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.02em;
    color: var(--gold-bright);
    margin: 0;
  }

  .today{
    margin-top: 12px;
    font-size: 15px;
    color: var(--off-white);
  }
  .today .weekday{
    color: var(--gold);
    font-weight: 600;
  }

  .divider{
    height: 1px;
    margin: 0 40px;
    background: linear-gradient(90deg, transparent, var(--rule) 20%, var(--rule) 80%, transparent);
  }

  .roster{
    padding: 10px 40px 6px;
  }

  .row{
    display:flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 22px 0;
    border-bottom: 1px solid rgba(139,141,142,0.16);
  }
  .row:last-child{ border-bottom: none; }

  .role{
    display:flex;
    align-items:center;
    gap: 14px;
    min-width: 0;
  }

  .role-badge{
    flex: none;
    width: 52px;
    height: 52px;
    border: 1px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: Georgia, "system-serif", serif;
    font-weight:700;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--gold-bright);
    background: linear-gradient(180deg, rgba(197,160,50,0.12), transparent);
    position: relative;
  }
  .role-badge::before, .role-badge::after{
    content:"";
    position:absolute;
    width:6px; height:6px;
    border: 1px solid var(--gold);
  }
  .role-badge::before{ top:-1px; left:-1px; border-width: 1px 0 0 1px; }
  .role-badge::after{ bottom:-1px; right:-1px; border-width: 0 1px 1px 0; }

  .role-text{ min-width:0; }
  .role-title{
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--gray);
  }

  .name{
    font-family: Georgia, "system-serif", "Times New Roman", serif;
    font-size: 21px;
    font-weight: 700;
    color: var(--off-white);
    text-align: right;
    line-height: 1.25;
    max-width: 300px;
  }
  .name.dim{
    color: var(--gray-dim);
    font-weight: 400;
    font-style: italic;
    font-size: 17px;
  }

  .board-bottom{
    padding: 18px 40px 30px;
    text-align:center;
  }

  .refresh{
    font-size: 11px;
    color: var(--gray-dim);
    letter-spacing: 0.05em;
  }

  .empty-msg{
    text-align:center;
    padding: 40px 20px 10px;
    color: var(--gray);
    font-size: 14px;
    line-height: 1.6;
  }

  @media (max-width: 480px){
    .board-top{ padding: 26px 22px 16px; }
    .roster{ padding: 6px 22px 6px; }
    .board-bottom{ padding: 14px 22px 24px; }
    .divider{ margin: 0 22px; }
    h1{ font-size: 24px; }
    .name{ font-size: 18px; max-width: 190px; }
    .role-badge{ width:44px; height:44px; font-size:12px; }
  }
</style>
</head>

const ROLES = [
  { key: "ccq", label: "CCQ", title: "CHARGE OF QUARTERS" },
  { key: "cdo", label: "CDO", title: "CADET DUTY OFFICER" },
  { key: "udo", label: "UDO", title: "UNIFORM / DUTY OFFICER" }
];

function pad(n){ return n < 10 ? "0" + n : "" + n; }

function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function cleanValue(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  return s.length ? s : null;
}

function render(){
  const key = todayKey();
  const now = new Date();

  document.getElementById("weekday").textContent =
    now.toLocaleDateString("en-US", { weekday: "long" }) + " \u2014 ";
  document.getElementById("fulldate").textContent =
    now.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  document.getElementById("refresh").textContent =
    "C-1 Duty Roster AY27-1  \u2022  loaded " +
    now.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

  const entry = ROSTER.find(e => e.date === key);
  const rosterEl = document.getElementById("roster");
  rosterEl.innerHTML = "";

  if (!entry) {
    rosterEl.innerHTML =
      '<div class="empty-msg">No roster entry on file for today.<br>' +
      'This board covers Aug 9 &ndash; Dec 25, 2026.</div>';
    return;
  }

  ROLES.forEach(role => {
    const raw = cleanValue(entry[role.key]);
    const row = document.createElement("div");
    row.className = "row";

    const nameClass = raw ? "name" : "name dim";
    const nameText = raw ? raw : "Not assigned";

    row.innerHTML =
      '<div class="role">' +
        '<div class="role-badge">' + role.label + '</div>' +
        '<div class="role-text"><div class="role-title">' + role.title + '</div></div>' +
      '</div>' +
      '<div class="' + nameClass + '">' + nameText + '</div>';

    rosterEl.appendChild(row);
  });
}
